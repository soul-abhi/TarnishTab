<!DOCTYPE html>
<!-- TarnishTab by @soul-abhi (https://github.com/soul-abhi). MIT License. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="soul-abhi">
  <meta name="copyright" content="(c) 2026 soul-abhi. MIT License.">
  <title>New Tab</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="wallpaper" class="wallpaper" aria-hidden="true"></div>

  <div class="page">

    <section class="sources-panel" aria-label="Source">
      <h1 class="section-title">Source</h1>
      <p class="sources-hint">Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Y</kbd> to save the active tab here.</p>
      <ul id="sourceList" class="links-list"></ul>
    </section>

    <section class="tasks todo-box" aria-label="Tasks">
      <h1 class="section-title">Tasks</h1>
      <form id="taskForm" class="task-form" autocomplete="off">
        <input id="taskInput" type="text" placeholder="Enter to add · Shift+Enter to reload…" aria-label="New task">
      </form>

      <h2 class="todo-heading">Task You Added <span id="pendingCount" class="todo-count">0</span></h2>
      <ul id="taskList" class="task-list" aria-label="Task You Added"></ul>

      <h2 class="todo-heading">Task You Completed <span id="doneCount" class="todo-count">0</span></h2>
      <ul id="doneList" class="task-list" aria-label="Task You Completed"></ul>
    </section>

    <section class="links-panel" aria-label="Bookmarks">
      <h1 class="section-title">Bookmarks</h1>
      <ul id="linksList" class="links-list"></ul>
      <button id="restoreLinksBtn" class="restore-links" type="button" hidden>Restore removed bookmarks</button>
    </section>

  </div>

  <div class="wallpaper-control">
    <div id="wallpaperPanel" class="wallpaper-panel" role="dialog" aria-label="Wallpaper" hidden>
      <h2 class="wallpaper-title">Wallpaper</h2>
      <p class="wallpaper-hint">Pick an image, GIF or video from your computer, or paste a link.</p>

      <label class="wallpaper-btn wallpaper-file">
        Choose from computer
        <input id="wallpaperFile" type="file" accept="image/*,video/mp4,video/webm,video/ogg" hidden>
      </label>

      <form id="wallpaperUrlForm" class="wallpaper-url" autocomplete="off">
        <input id="wallpaperUrl" type="url" placeholder="https://example.com/wallpaper.jpg" aria-label="Wallpaper link">
        <button class="wallpaper-btn" type="submit">Apply</button>
      </form>

      <p id="wallpaperStatus" class="wallpaper-status" role="status"></p>

      <div class="wallpaper-actions">
        <button id="wallpaperDim" class="wallpaper-btn ghost" type="button" aria-pressed="false">Dim</button>
        <button id="wallpaperReset" class="wallpaper-btn ghost" type="button">Reset to default</button>
      </div>
    </div>

    <button id="wallpaperToggle" class="wallpaper-toggle" type="button" aria-expanded="false" aria-controls="wallpaperPanel" title="Change wallpaper (Shift+W)">Wallpaper</button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
